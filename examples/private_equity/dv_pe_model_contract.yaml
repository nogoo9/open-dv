# Annotated Private Equity Data Vault 2.0 Model Contract (Apex Horizon Capital)
# Conforms to: schemas/no-mistake-dv2-contract-v5.schema.json
# Enforces: 100% Column Accountability, 3-Tier BK Authority, Gate 4 YAGNI Cost Guard, and Gate 5 Unstructured Rules

contract_version: "5.0"
domain_namespace: "pe_asset_management"
lifecycle_stage: "MULTI_SOURCE_EXPANSION"

column_triage_ledger:
  # --- TABLE 1: investran.src_pe_funds (INVESTRAN_FUND_ADMIN) ---
  - { bronze_table: "investran.src_pe_funds", column_name: "fund_code", elm_classification: "BUSINESS_KEY", target_dv_entity: "hub_fund" }
  - { bronze_table: "investran.src_pe_funds", column_name: "isin", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_fund_investran" }
  - { bronze_table: "investran.src_pe_funds", column_name: "fund_name", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_fund_investran" }
  - { bronze_table: "investran.src_pe_funds", column_name: "vintage_year", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_fund_investran" }
  - { bronze_table: "investran.src_pe_funds", column_name: "target_size_usd", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_fund_investran" }
  - { bronze_table: "investran.src_pe_funds", column_name: "strategy", elm_classification: "REFERENCE_CODE", target_dv_entity: "ref_fund_strategy" }
  - { bronze_table: "investran.src_pe_funds", column_name: "mgmt_fee_bps", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_fund_investran" }
  - { bronze_table: "investran.src_pe_funds", column_name: "deprecated_fax_no", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_fund_investran" }
  - { bronze_table: "investran.src_pe_funds", column_name: "ilpa_esg_rating", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_fund_investran_esg" }

  # --- TABLE 2: investran.src_lp_investors (INVESTRAN_FUND_ADMIN) ---
  - { bronze_table: "investran.src_lp_investors", column_name: "row_seq_id", elm_classification: "SYSTEM_SURROGATE_DROPPED", target_dv_entity: "DROPPED" }
  - { bronze_table: "investran.src_lp_investors", column_name: "lei", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_limited_partner_investran" }
  - { bronze_table: "investran.src_lp_investors", column_name: "lp_id", elm_classification: "BUSINESS_KEY", target_dv_entity: "hub_limited_partner" }
  - { bronze_table: "investran.src_lp_investors", column_name: "lp_legal_name", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_limited_partner_investran" }
  - { bronze_table: "investran.src_lp_investors", column_name: "domicile_country", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_limited_partner_investran" }
  - { bronze_table: "investran.src_lp_investors", column_name: "wire_iban", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_limited_partner_pii" }
  - { bronze_table: "investran.src_lp_investors", column_name: "tax_id", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_limited_partner_pii" }
  - { bronze_table: "investran.src_lp_investors", column_name: "tier_status", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_limited_partner_investran" }

  # --- TABLE 3: investran.src_lp_commitments_and_calls (INVESTRAN_FUND_ADMIN) ---
  - { bronze_table: "investran.src_lp_commitments_and_calls", column_name: "commitment_id", elm_classification: "DEGENERATE_KEY", target_dv_entity: "lnk_lp_commitment" }
  - { bronze_table: "investran.src_lp_commitments_and_calls", column_name: "fund_code", elm_classification: "FOREIGN_KEY_REF", target_dv_entity: "lnk_lp_commitment" }
  - { bronze_table: "investran.src_lp_commitments_and_calls", column_name: "lp_id", elm_classification: "FOREIGN_KEY_REF", target_dv_entity: "lnk_lp_commitment" }
  - { bronze_table: "investran.src_lp_commitments_and_calls", column_name: "commitment_amount_usd", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lp_commitment_investran" }
  - { bronze_table: "investran.src_lp_commitments_and_calls", column_name: "called_usd", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lp_commitment_investran" }
  - { bronze_table: "investran.src_lp_commitments_and_calls", column_name: "distribution_recallable_flag", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lp_commitment_investran" }
  - { bronze_table: "investran.src_lp_commitments_and_calls", column_name: "co_invest_portco_lei", elm_classification: "OPTIONAL_FOREIGN_KEY_REF", target_dv_entity: "lnk_lp_commitment_co_invest" }
  - { bronze_table: "investran.src_lp_commitments_and_calls", column_name: "eur_usd_rate", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lp_commitment_investran" }
  - { bronze_table: "investran.src_lp_commitments_and_calls", column_name: "gbp_usd_rate", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lp_commitment_investran" }
  - { bronze_table: "investran.src_lp_commitments_and_calls", column_name: "daily_interim_nav_usd", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lp_commitment_investran" }

  # --- TABLE 4: dealcloud.src_portfolio_companies (DEALCLOUD_PE_CRM) ---
  - { bronze_table: "dealcloud.src_portfolio_companies", column_name: "lei", elm_classification: "BUSINESS_KEY", target_dv_entity: "hub_portfolio_company" }
  - { bronze_table: "dealcloud.src_portfolio_companies", column_name: "deal_code", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_portfolio_company_dealcloud" }
  - { bronze_table: "dealcloud.src_portfolio_companies", column_name: "company_name", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_portfolio_company_dealcloud" }
  - { bronze_table: "dealcloud.src_portfolio_companies", column_name: "sector", elm_classification: "REFERENCE_CODE", target_dv_entity: "ref_industry_sector" }
  - { bronze_table: "dealcloud.src_portfolio_companies", column_name: "entry_ebitda_usd", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_portco_valuation_mnpi" }
  - { bronze_table: "dealcloud.src_portfolio_companies", column_name: "entry_ev_multiple", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_portco_valuation_mnpi" }
  - { bronze_table: "dealcloud.src_portfolio_companies", column_name: "gp_deal_partner", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_portfolio_company_dealcloud" }

  # --- TABLE 5: legacy_gp.src_legacy_lp_roster (LEGACY_GP_ADMIN) ---
  - { bronze_table: "legacy_gp.src_legacy_lp_roster", column_name: "lp_num", elm_classification: "BUSINESS_KEY", target_dv_entity: "hub_limited_partner" }
  - { bronze_table: "legacy_gp.src_legacy_lp_roster", column_name: "legacy_investor_name", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_limited_partner_legacy" }
  - { bronze_table: "legacy_gp.src_legacy_lp_roster", column_name: "contact_person", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_limited_partner_legacy" }
  - { bronze_table: "legacy_gp.src_legacy_lp_roster", column_name: "phone_number", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_limited_partner_legacy" }

  # --- UNSTRUCTURED ARTIFACTS: dms.documents (OBJECT_STORE_S3) ---
  - { bronze_table: "dms.documents", column_name: "doc_uri", elm_classification: "BUSINESS_KEY", target_dv_entity: "hub_document" }
  - { bronze_table: "dms.documents", column_name: "content_sha256", elm_classification: "TECHNICAL_METADATA", target_dv_entity: "sat_document_manifest" }
  - { bronze_table: "dms.documents", column_name: "mime_type", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_document_manifest" }
  - { bronze_table: "dms.documents", column_name: "byte_size", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_document_manifest" }

  # --- TABLE 6: mdm.src_lp_steward_crosswalk (MDM_STEWARD_RESOLUTION) ---
  - { bronze_table: "mdm.src_lp_steward_crosswalk", column_name: "master_lp_id", elm_classification: "FOREIGN_KEY_REF", target_dv_entity: "sal_limited_partner" }
  - { bronze_table: "mdm.src_lp_steward_crosswalk", column_name: "lp_num", elm_classification: "FOREIGN_KEY_REF", target_dv_entity: "sal_limited_partner" }

  # --- SCOUT-UNSTRUCTURED OUTPUT: dms.src_side_letter_extractions (OBJECT_STORE_S3) ---
  - { bronze_table: "dms.src_side_letter_extractions", column_name: "doc_uri", elm_classification: "FOREIGN_KEY_REF", target_dv_entity: "lnk_document_lp_commitment" }
  - { bronze_table: "dms.src_side_letter_extractions", column_name: "fund_code", elm_classification: "FOREIGN_KEY_REF", target_dv_entity: "lnk_document_lp_commitment" }
  - { bronze_table: "dms.src_side_letter_extractions", column_name: "lp_id", elm_classification: "FOREIGN_KEY_REF", target_dv_entity: "lnk_document_lp_commitment" }
  - { bronze_table: "dms.src_side_letter_extractions", column_name: "fee_cap_bps", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lp_side_letter_llm_ext" }
  - { bronze_table: "dms.src_side_letter_extractions", column_name: "headline_fee_bps", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lp_side_letter_llm_ext" }
  - { bronze_table: "dms.src_side_letter_extractions", column_name: "mfn_election_flag", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lp_side_letter_llm_ext" }
  - { bronze_table: "dms.src_side_letter_extractions", column_name: "co_invest_rofr", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lp_side_letter_llm_ext" }
  - { bronze_table: "dms.src_side_letter_extractions", column_name: "effective_date", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lp_side_letter_llm_ext" }
  - { bronze_table: "dms.src_side_letter_extractions", column_name: "extractor_model_id", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lp_side_letter_llm_ext" }
  - { bronze_table: "dms.src_side_letter_extractions", column_name: "confidence_score", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lp_side_letter_llm_ext" }
  - { bronze_table: "dms.src_side_letter_extractions", column_name: "chunk_id", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lp_side_letter_llm_ext" }
  - { bronze_table: "dms.src_side_letter_extractions", column_name: "evidence_quote", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lp_side_letter_llm_ext" }

  # --- SCOUT-UNSTRUCTURED OUTPUT: dms.src_ic_memo_extractions (OBJECT_STORE_S3) ---
  - { bronze_table: "dms.src_ic_memo_extractions", column_name: "doc_uri", elm_classification: "FOREIGN_KEY_REF", target_dv_entity: "lnk_document_portfolio_company" }
  - { bronze_table: "dms.src_ic_memo_extractions", column_name: "lei", elm_classification: "FOREIGN_KEY_REF", target_dv_entity: "lnk_document_portfolio_company" }
  - { bronze_table: "dms.src_ic_memo_extractions", column_name: "asc_820_level", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lnk_doc_portco_ai_provenance" }
  - { bronze_table: "dms.src_ic_memo_extractions", column_name: "ev_ebitda_multiple", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lnk_doc_portco_ai_provenance" }
  - { bronze_table: "dms.src_ic_memo_extractions", column_name: "implied_ev_usd", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lnk_doc_portco_ai_provenance" }
  - { bronze_table: "dms.src_ic_memo_extractions", column_name: "fair_value_usd", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lnk_doc_portco_ai_provenance" }
  - { bronze_table: "dms.src_ic_memo_extractions", column_name: "effective_date", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lnk_doc_portco_ai_provenance" }
  - { bronze_table: "dms.src_ic_memo_extractions", column_name: "extractor_model_id", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lnk_doc_portco_ai_provenance" }
  - { bronze_table: "dms.src_ic_memo_extractions", column_name: "confidence_score", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lnk_doc_portco_ai_provenance" }
  - { bronze_table: "dms.src_ic_memo_extractions", column_name: "chunk_id", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lnk_doc_portco_ai_provenance" }
  - { bronze_table: "dms.src_ic_memo_extractions", column_name: "evidence_quote", elm_classification: "DESCRIPTIVE_PAYLOAD", target_dv_entity: "sat_lnk_doc_portco_ai_provenance" }

hubs:
  - name: "hub_fund"
    ontology_concept_uri: "urn:ontology:entity:fund"
    business_key_sources:
      - bronze_table: "investran.src_pe_funds"
        key_columns: ["fund_code"]
        record_source_code: "INVESTRAN_FUND_ADMIN"
        key_authority_tier: "TIER_2_ENTERPRISE_SOR"
        require_src_qualifier: false
        bkcc_prefix: null

  - name: "hub_limited_partner"
    ontology_concept_uri: "urn:ontology:entity:limited_partner"
    business_key_sources:
      - bronze_table: "investran.src_lp_investors"
        key_columns: ["lp_id"]
        record_source_code: "INVESTRAN_FUND_ADMIN"
        key_authority_tier: "TIER_2_ENTERPRISE_SOR"
        require_src_qualifier: false
        bkcc_prefix: null
      - bronze_table: "legacy_gp.src_legacy_lp_roster"
        key_columns: ["lp_num"]
        record_source_code: "LEGACY_GP_ADMIN"
        key_authority_tier: "TIER_3_LOCAL_SCOPED"
        require_src_qualifier: true
        bkcc_prefix: "LEGACY_GP_ADMIN"
        system_scoped_bk_justification: "Acquired legacy GP Excel roster reuses LP-nnn codes that collide with enterprise lp_id values; scoped via BKCC."

  - name: "hub_portfolio_company"
    ontology_concept_uri: "urn:ontology:entity:portfolio_company"
    business_key_sources:
      - bronze_table: "dealcloud.src_portfolio_companies"
        key_columns: ["lei"]
        record_source_code: "DEALCLOUD_PE_CRM"
        key_authority_tier: "TIER_1_GLOBAL_STANDARD"
        require_src_qualifier: false
        bkcc_prefix: null

  - name: "hub_document"
    ontology_concept_uri: "urn:ontology:entity:document"
    business_key_sources:
      - bronze_table: "dms.documents"
        key_columns: ["doc_uri"]
        record_source_code: "OBJECT_STORE_S3"
        key_authority_tier: "TIER_2_ENTERPRISE_SOR"
        require_src_qualifier: false
        bkcc_prefix: null

links:
  - name: "lnk_lp_commitment"
    link_type: "STANDARD_LINK"
    ontology_concept_uri: "urn:ontology:relationship:lp_commitment"
    source_bronze_table: "investran.src_lp_commitments_and_calls"
    degenerate_columns: ["commitment_id"]
    hub_references:
      - target_hub: "hub_fund"
        role_alias: "COMMITTED_FUND"
        source_fk_columns: ["fund_code"]
      - target_hub: "hub_limited_partner"
        role_alias: "INVESTING_LP"
        source_fk_columns: ["lp_id"]

  - name: "lnk_lp_commitment_co_invest"
    link_type: "STANDARD_LINK"
    ontology_concept_uri: "urn:ontology:relationship:co_invest_allocation"
    source_bronze_table: "investran.src_lp_commitments_and_calls"
    degenerate_columns: ["commitment_id"]
    where_filter_condition: "co_invest_portco_lei IS NOT NULL"
    hub_references:
      - target_hub: "hub_fund"
        role_alias: "COMMITTED_FUND"
        source_fk_columns: ["fund_code"]
      - target_hub: "hub_limited_partner"
        role_alias: "INVESTING_LP"
        source_fk_columns: ["lp_id"]
      - target_hub: "hub_portfolio_company"
        role_alias: "CO_INVEST_ASSET"
        source_fk_columns: ["co_invest_portco_lei"]

  - name: "sal_limited_partner"
    link_type: "SAME_AS_LINK"
    ontology_concept_uri: "urn:ontology:relationship:entity_equivalence"
    source_bronze_table: "mdm.src_lp_steward_crosswalk"
    hub_references:
      - target_hub: "hub_limited_partner"
        role_alias: "MASTER_LP"
        # master_lp_id hashes under BKCC GLOBAL, the same key as the Tier-2 lp_id source.
        source_fk_columns: ["master_lp_id"]
      - target_hub: "hub_limited_partner"
        role_alias: "DUPLICATE_ALIAS_LP"
        # lp_num hashes under bkcc_prefix LEGACY_GP_ADMIN, the same key as the Tier-3 lp_num source.
        source_fk_columns: ["lp_num"]

  - name: "lnk_document_lp_commitment"
    link_type: "UNSTRUCTURED_EXTRACTION_LINK"
    ontology_concept_uri: "urn:ontology:relationship:side_letter_provenance"
    source_bronze_table: "dms.src_side_letter_extractions"
    hub_references:
      - target_hub: "hub_document"
        role_alias: "GOVERNING_SIDE_LETTER"
        source_fk_columns: ["doc_uri"]
      - target_hub: "hub_fund"
        role_alias: "GOVERNED_FUND"
        source_fk_columns: ["fund_code"]
      - target_hub: "hub_limited_partner"
        role_alias: "BENEFICIARY_LP"
        source_fk_columns: ["lp_id"]

  - name: "lnk_document_portfolio_company"
    link_type: "UNSTRUCTURED_EXTRACTION_LINK"
    ontology_concept_uri: "urn:ontology:relationship:document_entity_mention"
    source_bronze_table: "dms.src_ic_memo_extractions"
    hub_references:
      - target_hub: "hub_document"
        role_alias: "SOURCE_DOCUMENT"
        source_fk_columns: ["doc_uri"]
      - target_hub: "hub_portfolio_company"
        role_alias: "REFERENCED_PORTCO"
        source_fk_columns: ["lei"]

satellites:
  - name: "sat_fund_investran"
    satellite_type: "STANDARD_SATELLITE"
    parent_entity: "hub_fund"
    source_bronze_table: "investran.src_pe_funds"
    security_classification: "PUBLIC"
    volatility_tier: "STATIC"
    soft_deprecated_columns: ["deprecated_fax_no"]
    payload_columns:
      - "isin"
      - "fund_name"
      - "vintage_year"
      - "target_size_usd"
      - "mgmt_fee_bps"
      - "deprecated_fax_no"

  - name: "sat_fund_investran_esg"
    satellite_type: "STANDARD_SATELLITE"
    parent_entity: "hub_fund"
    source_bronze_table: "investran.src_pe_funds"
    security_classification: "PUBLIC"
    volatility_tier: "ADDITIVE_DRIFT_COMPANION"
    payload_columns:
      - "ilpa_esg_rating"

  - name: "sat_limited_partner_investran"
