    security_classification: "INTERNAL"
    volatility_tier: "STATIC"
    payload_columns:
      - "deal_code"
      - "company_name"
      - "gp_deal_partner"

  - name: "sat_portco_valuation_mnpi"
    satellite_type: "STANDARD_SATELLITE"
    parent_entity: "hub_portfolio_company"
    source_bronze_table: "dealcloud.src_portfolio_companies"
    security_classification: "CONFIDENTIAL"
    volatility_tier: "STANDARD"
    payload_columns:
      - "entry_ebitda_usd"
      - "entry_ev_multiple"

  - name: "sat_limited_partner_legacy"
    satellite_type: "STANDARD_SATELLITE"
    parent_entity: "hub_limited_partner"
    source_bronze_table: "legacy_gp.src_legacy_lp_roster"
    security_classification: "INTERNAL"
    volatility_tier: "STATIC"
    payload_columns:
      - "legacy_investor_name"
      - "contact_person"
      - "phone_number"

  - name: "sat_document_manifest"
    satellite_type: "STANDARD_SATELLITE"
    parent_entity: "hub_document"
    source_bronze_table: "dms.documents"
    security_classification: "INTERNAL"
    volatility_tier: "STATIC"
    payload_columns:
      - "content_sha256"
      - "mime_type"
      - "byte_size"

  # Rule U3 (docs/04): AI_PROVENANCE_SATELLITE entities compile into the business_vault schema.
  - name: "sat_lp_side_letter_llm_ext"
    satellite_type: "AI_PROVENANCE_SATELLITE"
    parent_entity: "lnk_document_lp_commitment"
    source_bronze_table: "dms.src_side_letter_extractions"
    security_classification: "CONFIDENTIAL"
    volatility_tier: "STANDARD"
    payload_columns:
      - "fee_cap_bps"
      - "headline_fee_bps"
      - "mfn_election_flag"
      - "co_invest_rofr"
      - "effective_date"
      - "extractor_model_id"
      - "confidence_score"
      - "chunk_id"
      - "evidence_quote"

  - name: "sat_lnk_doc_portco_ai_provenance"
    satellite_type: "AI_PROVENANCE_SATELLITE"
    parent_entity: "lnk_document_portfolio_company"
    source_bronze_table: "dms.src_ic_memo_extractions"
    security_classification: "CONFIDENTIAL"
    volatility_tier: "STANDARD"
    payload_columns:
      - "asc_820_level"
      - "ev_ebitda_multiple"
      - "implied_ev_usd"
