        key_authority_tier: "TIER_1_GLOBAL_STANDARD"
        require_src_qualifier: false
        bkcc_prefix: "GLOBAL"
  - name: "hub_invoice"
    ontology_concept_uri: "urn:ontology:entity:invoice"
