- name: lnk_order_customer_promotion
  link_type: STANDARD_LINK
  ontology_concept_uri: urn:ontology:relationship:order_customer
  source_bronze_table: erp_netsuite.erp_orders
  hub_references:
  - *id001
  - target_hub: hub_promotion
    role_alias: promotion
    source_fk_columns:
    - promo_campaign_code
  where_filter_condition: promo_campaign_code IS NOT NULL
