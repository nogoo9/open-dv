<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stage drill-down</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; min-height: 1040px; background: #F6F7F8">
<dc-import name="Main" start-view="stage" start-stage="{{ stageIdx }}" hint-size="100%,1040px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stageIdx":{"editor":"int","min":0,"max":7,"default":5},"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    return { stageIdx: this.props.stageIdx ?? 5 };
  }
}
</script>
</body>
</html>
