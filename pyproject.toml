# /pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendv"
version = "2.0.0"
description = "Open-DV (2.0.0): Neuro-Symbolic Data Vault 2.0 Modeller, 3-Loop CEGAR Prover & Multi-Dialect Compiler"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.6.0",
    "duckdb>=1.2.0",
    "pyarrow>=18.0.0",
    "sqlglot>=26.0.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0.0",
    "networkx>=3.4.0",
    "httpx>=0.28.0",
    "openpyxl>=3.1.0",
    "tiktoken>=0.8.0",
    "jinja2>=3.1.0",
    "keyring>=25.0.0",
    "typer>=0.15.0",
    "python-docx>=1.1.0",
    "pypdfium2>=4.30.0",
]

[project.scripts]
opendv = "opendv.cli.main:main"

[project.optional-dependencies]
databricks = ["databricks-sql-connector>=3.0.0"]
sdk = ["anthropic>=0.40.0", "google-genai>=1.0.0"]
ocr = ["pytesseract>=0.3.13", "Pillow>=10.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/opendv"]
artifacts = [
    "src/opendv/api/static/**",
    "src/opendv/sources/fibo/fibo-core-pack.json",
]

[tool.hatch.build.targets.wheel.force-include]
"schemas/v2" = "opendv/schemas/v2"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "types-PyYAML>=6.0.12",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",
    "duckdb>=1.2.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.10.0",
    "networkx>=3.4.0",
    "sqlglot>=26.0.0",
    "pylint>=3.0.0",
    "rdflib>=7.0.0",
    "tiktoken>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "SIM",
    "RUF",
    "TID251",
    "BLE001",
    "S110",
    "S112",
    "TRY",
]
ignore = [
    "TRY003",
    "TRY004",
    "TRY300",
    "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "E501",
    "F401",
    "F841",
    "B007",
    "B905",
    "N806",
    "I001",
    "RUF002",
    "RUF003",
    "RUF012",
    "RUF015",
    "RUF019",
    "RUF043",
    "RUF059",
    "BLE001",
    "E741",
    "UP034",
    "S110",
    "S112",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"antigravity".msg = "Import from 'google.antigravity', never Python stdlib 'antigravity' (xkcd/353)."

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["opendv.*"]
strict = true
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q --strict-markers --import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "parity: Cross-surface parity tests between CLI and REST transports",
    "golden: Golden regression tests against committed vectors",
    "hardening: Security, fail-fast, and isolation invariant tests",
    "slow: Long-running multi-wave or end-to-end integration tests",
    "live_provider: Integration tests requiring live LLM providers",
    "architecture: Architecture, import contract, and no-duplication tests",
]
pythonpath = ["src"]
testpaths = ["tests"]
