name: Open-DV V2 CI

on:
  push:
    branches:
      - main
      - "dev/**"
      - "phase/**"
      - "fm/**"
  pull_request:
    branches:
      - main
      - "dev/**"
      - "phase/**"

permissions:
  contents: read

jobs:
  validate-v2:
    name: Open-DV V2 CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.11"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Verify uv lockfile & install Python dependencies
        run: |
          uv lock --check
          uv sync --locked --group dev

      - name: Install Web Workbench dependencies
        run: bun install --cwd web --frozen-lockfile

      - name: Web Workbench typecheck, lint, build & unit tests
        run: |
          bun run --cwd web typecheck
          bun run --cwd web lint
          bun run --cwd web build
          bun run --cwd web test

      - name: Marketing Website typecheck, lint, build & unit tests
        shell: bash
        run: |
          bun install --cwd apps/opendv-website --frozen-lockfile
          bun run --cwd apps/opendv-website typecheck
          bun run --cwd apps/opendv-website lint
          OPENDV_SITE_BASE_PATH=/open-dv bun run --cwd apps/opendv-website build
          bun test apps/opendv-website/tests

      - name: Build & verify isolated wheel outside repo root
        shell: bash
        run: |
          set -euo pipefail
          WHEEL_DIR="$RUNNER_TEMP/opendv_wheel_check"
          rm -rf "$WHEEL_DIR" && mkdir -p "$WHEEL_DIR"
          uv build --wheel --out-dir "$WHEEL_DIR"
          WHL="$(ls "$WHEEL_DIR"/opendv-*.whl | head -n 1)"
          uv run --no-sync python - "$WHL" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = set(zf.namelist())
          assert "opendv/api/static/index.html" in names, "Missing web static index.html in wheel"
          assert "opendv/grounding/kernel/iso_codes.json" in names, "Missing iso_codes.json in wheel"
          assert "opendv/grounding/providers/fibo/fibo-core-pack.json" in names, "Missing fibo-core-pack.json in wheel"
          assert "opendv/grounding/providers/fibo/fibo_calibration.json" in names, "Missing fibo_calibration.json in wheel"
          assert "opendv/grounding/providers/glossary/example_glossary.yaml" in names, "Missing example_glossary.yaml in wheel"
          assert "opendv/agents/packs/dv2-modeling-guide.md" in names, "Missing dv2-modeling-guide.md in wheel"
          packs = [n for n in names if n.startswith("opendv/agents/packs/") and n.endswith("/SKILL.md")]
          assert len(packs) == 6, f"Expected 6 SKILL.md packs, got {len(packs)}: {packs}"
          for rel in ("cli-spec.json", "error-codes.json", "openapi.json", "baseline-digests.json", "matchers/bm25_fibo_v1.json"):
              assert f"opendv/schemas/v2/{rel}" in names, f"Missing opendv/schemas/v2/{rel} in wheel"
          PY
          uv venv "$WHEEL_DIR/venv" --python 3.12
          if [ -x "$WHEEL_DIR/venv/Scripts/python.exe" ]; then
            VENV_BIN="$WHEEL_DIR/venv/Scripts"
            VENV_PY="$VENV_BIN/python.exe"
          else
            VENV_BIN="$WHEEL_DIR/venv/bin"
            VENV_PY="$VENV_BIN/python"
          fi
          uv pip install --python "$VENV_PY" "$WHL"
          (
            cd "$WHEEL_DIR"
            export PATH="$VENV_BIN:$PATH"
            export OPENDV_HOME="$WHEEL_DIR/opendv_home"
            export LOCALAPPDATA="$WHEEL_DIR/state"
            export XDG_STATE_HOME="$WHEEL_DIR/state"
            opendv --help >/dev/null
            opendv --json agents list | python -c "import json, sys; d = json.load(sys.stdin); assert d['ok'] is True and len(d['data']) == 6"
            opendv --json model spec --part preferences | python -c "import json, sys; d = json.load(sys.stdin); assert d['ok'] is True and 'preferences' in d['data']"
            python -c "from pathlib import Path; import opendv; from opendv.grounding.providers.fibo import FiboKnowledgeSource; from opendv.grounding.providers.fibo.loader import FiboReferenceOntologyLoader; from opendv.grounding.providers.glossary import GlossaryKnowledgeSource; p = Path(opendv.__file__).parent; assert (p / 'api/static/index.html').is_file(); assert (p / 'grounding/kernel/iso_codes.json').is_file(); assert (p / 'grounding/providers/fibo/fibo-core-pack.json').is_file(); assert (p / 'grounding/providers/fibo/fibo_calibration.json').is_file(); assert (p / 'grounding/providers/glossary/example_glossary.yaml').is_file(); assert (p / 'schemas/v2/openapi.json').is_file(); assert FiboKnowledgeSource().calibration_params is not None; assert len(FiboReferenceOntologyLoader().search_candidates('Legal Entity', limit=1)) == 1; assert GlossaryKnowledgeSource().metadata.source_id == 'glossary'; print('WHEEL_OK')"
          )
          rm -rf "$WHEEL_DIR"

      - name: Run Ruff static analysis
        run: uv run ruff check src tests scripts

      - name: Run Mypy strict typecheck
        run: uv run mypy src tests/helpers

      - name: Verify contracts, schemas/v2, error codes & CLI reference docs
        run: |
          uv run python -m opendv.cli.export_contracts --check
          uv run python scripts/check_error_codes.py --catalog schemas/v2/error-codes.json --baselines schemas/v2/baseline-digests.json --check-ast
          uv run python scripts/generate_cli_reference.py
          git diff --exit-code docs/16-cli-reference.md

      - name: Run V2 Python test suite (non-live, 0-skip gate)
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/pytest-nonlive.log"
          uv run pytest tests/ -m "not live_provider" -o addopts="" -q -rs | tee "$LOG_FILE"
          uv run --no-sync python - "$LOG_FILE" <<'PY'
          import pathlib, re, sys
          txt = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          m = re.search(r"(\d+)\s+skipped\b", txt)
          if m and int(m.group(1)) > 0:
              sys.exit(f"0-skip gate failed: {m.group(1)} test(s) skipped")
          PY
          rm -f "$LOG_FILE"

      - name: Install Playwright Chromium & run Web Workbench E2E
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            bun run --cwd web playwright install chromium --with-deps
          else
            bun run --cwd web playwright install chromium
          fi
          bun run --cwd web test:e2e
