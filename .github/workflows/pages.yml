name: Open-DV Website & GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build, Test & Verify Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck TypeScript project references
        run: bun x tsc -b --pretty

      - name: Lint website sources with Biome
        run: bun run --cwd apps/opendv-website lint

      - name: Build static website for GitHub Pages
        env:
          OPENDV_SITE_BASE_PATH: /open-dv
        run: bun run --cwd apps/opendv-website build

      - name: Run website unit & build tests
        run: bun test apps/opendv-website/tests

      - name: Install Playwright Chromium
        run: bun run --cwd apps/opendv-website playwright install --with-deps chromium

      - name: Run Playwright E2E verification
        run: bun run --cwd apps/opendv-website test:e2e

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/opendv-website/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
