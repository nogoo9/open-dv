[project]
name = "opendv-cli"
version = "0.1.0"
description = "Open-DV Standalone In-Process Engine CLI (opendv and axi-dv)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "opendv-core",
    "opendv-contracts",
    "opendv-cli-common",
    "opendv-service",
]

[project.scripts]
opendv = "opendv_cli.main:app_main"
axi-dv = "opendv_cli.main:axi_dv_main"

[tool.uv.sources]
opendv-core = { workspace = true }
opendv-contracts = { workspace = true }
opendv-cli-common = { workspace = true }
opendv-service = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
