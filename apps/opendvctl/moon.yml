$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'opendvctl'
language: 'typescript'
layer: 'application'
tags:
  - 'typescript'
  - 'client-cli'

dependsOn:
  - 'opendv-protocol-ts'

tasks:
  build:
    description: 'Compile native binary for host system.'
    command: 'bun'
    args:
      - 'run'
      - 'build'
  build-all:
    description: 'Compile single-file binaries across all 5 release targets.'
    command: 'bun'
    args:
      - 'run'
      - 'build:all'
  package:
    description: 'Build all release targets and generate compressed distribution archives.'
    command: 'bun'
    args:
      - 'run'
      - 'package'
  test:
    description: 'Execute unit tests with bun test.'
    command: 'bun'
    args:
      - 'test'
