[project]
name = "opendv-platform-api"
version = "0.1.0"
description = "Open-DV Headless Platform ASGI Server (/api/v1 REST + SSE)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.9.0",
    "opendv-core",
    "opendv-telemetry",
    "opendv-axi-verifier",
    "opendv-duckdb-sandbox",
    "opendv-agent-harness",
]

[tool.uv.sources]
opendv-core = { workspace = true }
opendv-telemetry = { workspace = true }
opendv-axi-verifier = { workspace = true }
opendv-duckdb-sandbox = { workspace = true }
opendv-agent-harness = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
