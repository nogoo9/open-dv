[project]
name = "opendv-testkit"
version = "0.1.0"
description = "Open-DV Dev-Only Testkit: Deterministic Harness Adapters, Vendor SDK Shims, and Ephemeral Fixtures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opendv-contracts",
    "opendv-core",
    "opendv-telemetry",
    "opendv-agent-harness",
    "opendv-service",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
