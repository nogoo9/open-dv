[project]
name = "opendv-testkit"
version = "0.1.0"
description = "Open-DV Dev-Only Testkit: Deterministic Harness Adapters, Vendor SDK Shims, and Ephemeral Fixtures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opendv-contracts",
    "opendv-core",
    "opendv-telemetry",
    "opendv-agent-harness",
    "opendv-service",
    "opendv-sources",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
]

[project.entry-points."opendv.source_adapters"]
records = "opendv_testkit.sources:RecordsSourceAdapter"

[project.entry-points."opendv.ontology_recommenders"]
deterministic_testkit = "opendv_testkit.ontology:DeterministicTestkitRecommender"
testkit_recommender = "opendv_testkit.ontology:DeterministicTestkitRecommender"

[tool.uv.sources]
opendv-contracts = { workspace = true }
opendv-core = { workspace = true }
opendv-telemetry = { workspace = true }
opendv-agent-harness = { workspace = true }
opendv-service = { workspace = true }
opendv-sources = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
