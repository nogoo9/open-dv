[project]
name = "opendv-sources"
version = "0.1.0"
description = "Open-DV Pluggable Data Source & Format Adapter SPI, Registries, and Conformance Kit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opendv-contracts",
    "opendv-core",
    "duckdb>=1.2.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
# Standard plugin extras (will be enabled as plugins are introduced in Tasks P4.2-P4.4)
# file = ["opendv-source-file"]
# inline = ["opendv-source-inline"]
# db = ["opendv-source-duckdb-attach"]
text = []
pdf = ["pypdf>=5.0.0"]

[project.entry-points."opendv.source_adapters"]
file = "opendv_sources.adapters.filesystem:LocalFilesystemSourceAdapter"
filesystem = "opendv_sources.adapters.filesystem:LocalFilesystemSourceAdapter"
inline = "opendv_sources.adapters.inline:InlineSourceAdapter"
duckdb_attach = "opendv_sources.adapters.duckdb_attach:DuckdbAttachSourceAdapter"
sqlite = "opendv_sources.adapters.duckdb_attach:DuckdbAttachSourceAdapter"
duckdb = "opendv_sources.adapters.duckdb_attach:DuckdbAttachSourceAdapter"
text = "opendv_sources.adapters.text_document:TextDocumentSourceAdapter"
txt = "opendv_sources.adapters.text_document:TextDocumentSourceAdapter"
md = "opendv_sources.adapters.text_document:TextDocumentSourceAdapter"
markdown = "opendv_sources.adapters.text_document:TextDocumentSourceAdapter"
pdf = "opendv_sources.adapters.pdf_document:PdfDocumentSourceAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
