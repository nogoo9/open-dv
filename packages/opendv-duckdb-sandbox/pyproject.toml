[project]
name = "opendv-duckdb-sandbox"
version = "0.1.0"
description = "Open-DV Graph B Profiler, 4-Zone SQL Compiler, and DuckDB 4-Batch Shadow Sandbox"
requires-python = ">=3.12"
dependencies = [
    "opendv-core",
    "opendv-axi-verifier",
    "opendv-telemetry",
    "opendv-sources",
    "duckdb>=1.1.0",
    "pydantic>=2.9.0",
]

[tool.uv.sources]
opendv-core = { workspace = true }
opendv-axi-verifier = { workspace = true }
opendv-telemetry = { workspace = true }
opendv-sources = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
