$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'opendv-core'
language: 'python'
layer: 'library'
tags:
  - 'python'
  - 'domain-core'

dependsOn: []

tasks:
  validate-schemas:
    description: 'Validate normative Draft 2020-12 JSON schemas against example contracts and IRs.'
    command: 'uv'
    args:
      - 'run'
      - '--package'
      - 'opendv-core'
      - 'python'
      - '-m'
      - 'opendv_core.cli_validate_schemas'
    inputs:
      - '/schemas/*.json'
      - '/examples/**/*'
      - 'src/**/*.py'
    options:
      runFromWorkspaceRoot: true
