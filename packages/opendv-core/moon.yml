$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'opendv-core'
language: 'python'
layer: 'library'
tags:
  - 'python'
  - 'domain-core'

dependsOn: []

tasks:
  validate-schemas:
    description: 'Validate normative Draft 2020-12 JSON schemas.'
    command: 'uv'
    args:
      - 'run'
      - '--package'
      - 'opendv-core'
      - 'python'
      - '-c'
      - 'import json, pathlib, jsonschema; paths = sorted(pathlib.Path("schemas").glob("*.json")); assert paths, "No schema files found in schemas/"; [jsonschema.Draft202012Validator.check_schema(json.loads(p.read_text(encoding="utf-8"))) for p in paths]; print("Normative schemas valid.")'
    inputs:
      - '/schemas/*.json'
    options:
      runFromWorkspaceRoot: true
