[project]
name = "opendv-cli-common"
version = "0.1.0"
description = "Open-DV Spec-Driven CLI Parser, JCS Printer, Presenter, and Executor Base"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "opendv-contracts",
]

[tool.uv.sources]
opendv-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
