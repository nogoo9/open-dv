[project]
name = "opendv-agent-harness"
version = "0.1.0"
description = "Open-DV Agnostic Agent Harness with Google Antigravity and Claude Agent SDK Adapters"
requires-python = ">=3.12"
dependencies = [
    "opendv-contracts",
    "opendv-core",
    "opendv-axi-verifier",
    "opendv-duckdb-sandbox",
    "opendv-telemetry",
    "opendv-sources",
]

[tool.uv.sources]
opendv-contracts = { workspace = true }
opendv-core = { workspace = true }
opendv-axi-verifier = { workspace = true }
opendv-duckdb-sandbox = { workspace = true }
opendv-telemetry = { workspace = true }
opendv-sources = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
