[project]
name = "opendv-service"
version = "0.1.0"
description = "Open-DV Shared Headless Application Core Service & Pipeline Orchestrator"
requires-python = ">=3.12"
dependencies = [
    "opendv-contracts",
    "opendv-core",
    "opendv-axi-verifier",
    "opendv-duckdb-sandbox",
    "opendv-agent-harness",
    "opendv-telemetry",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "duckdb>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
